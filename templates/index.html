<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English to Hindi Translator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1200px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:25px;
    padding:30px;
    color:white;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:2.8rem;
    margin-bottom:10px;
}

.header p{
    color:#cbd5e1;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:20px;
}

.card h3{
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:250px;
    border:none;
    outline:none;
    resize:none;
    border-radius:15px;
    padding:15px;
    font-size:16px;
}

.output{
    min-height:250px;
    background:white;
    color:#111827;
    border-radius:15px;
    padding:15px;
    white-space:pre-wrap;
    overflow-y:auto;
}

.actions{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.success{
    background:#10b981;
    color:white;
}

.danger{
    background:#ef4444;
    color:white;
}

.copy-btn{
    background:#8b5cf6;
    color:white;
}

.history{
    margin-top:35px;
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.history-list{
    margin-top:20px;
}

.history-item{
    background:rgba(255,255,255,0.08);
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
}

.label{
    font-weight:600;
    color:#93c5fd;
}

.timestamp{
    margin-top:8px;
    font-size:12px;
    color:#cbd5e1;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#cbd5e1;
    font-size:14px;
}

@media(max-width:768px){

.grid{
    grid-template-columns:1fr;
}

.header h1{
    font-size:2rem;
}

}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌐 English → Hindi Translator</h1>
        <p>AI Powered Neural Machine Translation System</p>
    </div>

    <div class="grid">

        <div class="card">
            <h3>English Input</h3>

            <textarea
                id="inputText"
                placeholder="Enter English text here..."
            ></textarea>

            <div class="actions">
                <button class="primary" onclick="translateText()">Translate</button>
                <button class="secondary" onclick="clearInput()">Clear</button>
                <button class="success" onclick="loadSample()">Sample</button>
            </div>
        </div>

        <div class="card">
            <h3>Hindi Translation</h3>

            <div id="output" class="output">
Translation will appear here...
            </div>

            <div class="actions">
                <button class="copy-btn" onclick="copyTranslation()">
                    Copy Translation
                </button>
            </div>
        </div>

    </div>

    <div class="history">

        <div class="history-header">
            <h2>📜 Translation History</h2>

            <div class="actions">
                <button class="danger" onclick="clearHistory()">
                    Clear History
                </button>

                <button class="success" onclick="exportHistory()">
                    Export CSV
                </button>
            </div>
        </div>

        <div id="history" class="history-list"></div>

    </div>

    <div class="footer">
        Developed with Flask • TensorFlow • Seq2Seq Neural Translation
    </div>

</div>

<script>

async function translateText(){

    const text=document.getElementById('inputText').value;

    if(!text.trim()){
        alert("Please enter text first.");
        return;
    }

    document.getElementById('output').innerHTML=
        "⏳ Translating...";

    try{

        const response=await fetch('/translate',{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({text})
        });

        const data=await response.json();

        if(response.ok && data.success){

            document.getElementById('output').innerHTML=
                data.hindi || "No translation generated";

            loadHistory();

        }else{

            document.getElementById('output').innerHTML=
                "❌ " + data.error;
        }

    }catch(error){

        document.getElementById('output').innerHTML=
            "❌ " + error.message;
    }
}

async function loadHistory(){

    const res=await fetch('/history');
    const history=await res.json();

    const div=document.getElementById('history');

    if(!history.length){

        div.innerHTML=
            "<p>No translation history available.</p>";

        return;
    }

    div.innerHTML=history.slice().reverse().map(item=>`

        <div class="history-item">

            <div>
                <span class="label">English:</span>
                ${item.english}
            </div>

            <br>

            <div>
                <span class="label">Hindi:</span>
                ${item.hindi}
            </div>

            ${item.timestamp ?
            `<div class="timestamp">${item.timestamp}</div>`
            : ""}

        </div>

    `).join('');
}

async function clearHistory(){

    await fetch('/clear_history',{
        method:'POST'
    });

    loadHistory();
}

function exportHistory(){
    window.location.href='/export_history';
}

function clearInput(){

    document.getElementById('inputText').value='';

    document.getElementById('output').innerHTML=
        'Translation will appear here...';
}

function loadSample(){

    document.getElementById('inputText').value=
        'How are you today?';
}

function copyTranslation(){

    const text=document.getElementById('output').innerText;

    navigator.clipboard.writeText(text);

    alert('Translation copied!');
}

document.getElementById('inputText')
.addEventListener('keydown',function(e){

    if(e.key==='Enter' && !e.shiftKey){

        e.preventDefault();
        translateText();
    }

});

loadHistory();

</script>

</body>
</html>
